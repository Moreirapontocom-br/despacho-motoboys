# Roda os testes automáticos (test_despacho.py) toda vez que um código novo
# chega ao GitHub. O resultado aparece como ✅ ou ❌ ao lado de cada alteração.
# No Render, em Settings > Auto-Deploy, escolha "After CI Checks Pass" para
# o site só ser publicado quando os testes passarem.
name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:   # permite rodar na mão pela aba "Actions" do GitHub

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install fastapi sqlalchemy httpx pytest

      - name: Rodar os testes
        run: pytest -v
